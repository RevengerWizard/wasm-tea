<!DOCTYPE html>
<html>
<head>
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
	<title>teascript-wasm</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" crossorigin="anonymous">
	<style type="text/css" media="screen">
		#editor {
			border-radius: 5px;
		}

		#run {
			margin-top: 10px;
		}

		#terminal {
			box-sizing: border-box;
			border-radius: 5px;
			border: 1px solid lightgray;
			margin-top: 10px;
			height: 320px;
			padding: 0;
			overflow: hidden;
			background: #1e1e1e;
		}

		#terminal .xterm {
			width: 100%;
			height: 100%;
		}

		#container {
			max-width: 800px;
			margin: 100px auto;
		}

	</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.24.1/ace.js" crossorigin="anonymous" type="text/javascript" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" crossorigin="anonymous"></script>
<script src="mode-tea.js" type="text/javascript" charset="utf-8"></script>
<body>
<div id="container">
	<h1><a href="https://github.com/RevengerWizard/teascript">Teascript</a></h1>
	<div id="editor">print("Hello, world!")</div>

	<button id="run" onclick="run_input()">Run</button>
	<button id="clear" onclick="clear_output()">Clear</button>
	<button id="share" onclick="share()">Share Code</button>

	<h5>Output</h5>
	<div id="terminal" aria-label="Program terminal"></div>
	<script src="index.js?v=xterm-input-scroll"></script>
</div>
</body>
</html>
