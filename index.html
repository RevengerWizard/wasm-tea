<!DOCTYPE html>
<html>
<head>
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
	<title>teascript-wasm</title>
	<style type="text/css" media="screen">
		#editor {
			border-radius: 5px;
		}

		#run {
			margin-top: 10px;
		}

		#output {
			border-radius: 5px;
			border: 1px solid lightgray;
			padding: 14px;
			margin-top: 10px;
			overflow-y: auto;
		}

		#output {
			white-space: pre-wrap;
			font-family: monospace;
			min-height: 1em;
		}

		#output-input {
			min-width: 1ch;
			outline: none;
			white-space: pre-wrap;
		}

		#container {
			max-width: 800px;
			margin: 100px auto;
		}

		.error {
			color: red;
		}
	</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.24.1/ace.js" crossorigin="anonymous" type="text/javascript" charset="utf-8"></script>
<script src="mode-tea.js" type="text/javascript" charset="utf-8"></script>
<body>
<div id="container">
	<h1><a href="https://github.com/RevengerWizard/teascript">Teascript</a></h1>
	<div id="editor">print("Hello, world!")</div>

	<button id="run" onclick="run_input()">Run</button>
	<button id="clear" onclick="clear_output()">Clear</button>
	<button id="share" onclick="share()">Share Code</button>

	<h5>Output</h5>
	<pre id="output" aria-label="Program output"></pre>
	<script src="index.js"></script>
</div>
</body>
</html>
